name: Verify release assets

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (for example v2.1.3-claude)
        required: true

permissions:
  contents: read

jobs:
  stable-release-metadata:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A release event defaults to its historical tag, which lacks this checker.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download published archives
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir assets
      - name: Reject release-candidate or unapproved packaged metadata
        run: |
          version="${TAG#v}"
          version="${version%%-*}"
          python3 scripts/check_release_metadata.py assets/*.zip \
            --expect-version "$version" --superseded metadata/superseded-assets.json
