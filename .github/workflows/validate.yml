name: Validate skill package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  behavioral-evaluation-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate package and evaluation definitions
        run: python3 scripts/evaluate.py validate
