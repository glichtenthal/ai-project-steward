<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saved reports — local demo</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #fff; line-height: 1.5; --secondary: #475569; --blue: #1d4ed8; --divider: #cbd5e1; }
    * { box-sizing: border-box; }
    body { margin: 0; font-size: 1rem; }
    .modal-open, .modal-open body { overflow: hidden; }
    [hidden] { display: none !important; }
    .workspace { max-width: 1040px; margin: auto; padding: 32px; }
    h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 8px; }
    h2 { font-size: 1.125rem; line-height: 1.35; margin: 0; font-weight: 600; }
    p { margin: 0; }
    .demo-label { display: inline-block; color: var(--secondary); font-weight: 600; margin-bottom: 8px; }
    .helper, .metadata, .hint { color: var(--secondary); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px; margin: 32px 0 24px; }
    .search-group { flex: 1 1 320px; }
    .mode-group { flex: 0 1 240px; }
    .search-controls { display: flex; flex-wrap: wrap; gap: 8px; }
    .search-controls input { flex: 1 1 160px; width: 100%; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    .hint { font-size: .875rem; margin-top: 4px; }
    input, select, button { font: inherit; min-height: 44px; border: 1px solid var(--secondary); border-radius: 8px; background: #fff; color: #172033; padding: 8px 16px; }
    select { width: 100%; }
    button { cursor: pointer; white-space: normal; overflow-wrap: anywhere; }
    button:active:not(:disabled) { background: #e2e8f0; }
    button:disabled { color: var(--secondary); background: #f1f5f9; border-style: dashed; cursor: not-allowed; }
    .primary { color: #fff; background: var(--blue); border-color: var(--blue); }
    .primary:active:not(:disabled) { color: #fff; background: #1e40af; }
    :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
    .report-list, .feedback-list { list-style: none; margin: 0; padding: 0; }
    .report { display: flex; align-items: center; gap: 24px; padding: 24px 0; border-bottom: 1px solid var(--divider); }
    .report:first-child { border-top: 1px solid var(--divider); }
    .report-content { flex: 1; }
    .metadata { display: flex; flex-wrap: wrap; gap: 4px 24px; font-size: .875rem; margin-top: 4px; }
    .message { padding: 24px 0; }
    .blocked { padding: 16px; border: 1px solid var(--secondary); border-radius: 8px; margin-bottom: 16px; }
    .message button { margin-top: 16px; }
    .feedback-list { margin-top: 24px; }
    .feedback { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--divider); }
    .toolbar > *, .search-controls > *, .report > *, .feedback > * { min-width: 0; }
    h1, h2, p, label, .demo-label, .metadata { overflow-wrap: anywhere; }
    dialog { color: #172033; background: #fff; width: min(480px, calc(100% - 32px)); max-width: calc(100% - 32px); max-height: calc(100vh - 32px); max-height: calc(var(--dialog-height, 100dvh) - 32px); padding: 24px; border: 1px solid var(--secondary); border-radius: 8px; overflow-y: auto; overscroll-behavior: contain; }
    dialog::backdrop { background: rgb(23 32 51 / 45%); }
    dialog h2 { font-size: 1.5rem; }
    dialog p { margin-top: 16px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
    .dialog-actions button { min-width: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    @media (hover: hover) and (pointer: fine) {
      button:hover:not(:disabled) { background: #f1f5f9; }
      .primary:hover:not(:disabled) { background: #1e40af; }
    }
    @media (min-width: 640px) and (max-width: 1023px) { .workspace { padding: 24px; } }
    @media (max-width: 639px) {
      .workspace { padding: 16px; }
      h1 { font-size: 1.75rem; }
      .toolbar { flex-direction: column; gap: 16px; margin-top: 24px; }
      .search-group, .mode-group { flex: auto; width: 100%; }
      .report, .feedback { flex-direction: column; align-items: flex-start; gap: 16px; }
      .metadata { flex-direction: column; }
      dialog { padding: 16px; }
      .dialog-actions { flex-direction: column; }
      .dialog-actions button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="workspace">
    <header>
      <h1>Saved reports</h1>
      <p class="demo-label">Synthetic demo data</p>
      <p class="helper">Find a saved report or try archiving one. Reload to restore demo data.</p>
    </header>
    <main>
      <div class="toolbar">
        <div class="search-group">
          <label for="search">Search reports</label>
          <div class="search-controls">
            <input id="search" type="search" autocomplete="off" aria-controls="results">
            <button id="clear" type="button" hidden>Clear search</button>
          </div>
        </div>
        <div class="mode-group">
          <label for="mode">Demo state</label>
          <select id="mode" aria-describedby="demo-hint">
            <option value="normal" selected>Normal</option>
            <option value="loading">Loading</option>
            <option value="error">Error</option>
            <option value="blocked">Permission denied</option>
          </select>
          <p id="demo-hint" class="hint">Local demo only; no server or permissions are checked.</p>
        </div>
      </div>
      <section id="results" aria-label="Saved reports" aria-busy="false"></section>
      <section id="feedback" aria-label="Archive feedback" hidden>
        <ul id="feedback-list" class="feedback-list"></ul>
      </section>
      <p id="status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
      <noscript>This local demo requires JavaScript for reports, search and reversible archive actions.</noscript>
    </main>
  </div>
  <dialog id="archive-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <h2 id="dialog-title"></h2>
    <p id="dialog-description">This removes the report from this demo list. You can undo it. Reloading restores all demo reports.</p>
    <div class="dialog-actions">
      <button id="cancel" type="button" autofocus>Cancel</button>
      <button id="confirm" type="button" class="primary">Archive report</button>
    </div>
  </dialog>
  <script>
    'use strict';
    const reports = Object.freeze([
      Object.freeze({ id: 'inventory-exceptions', title: 'Inventory exceptions', owner: 'Operations', updated: 'Today' }),
      Object.freeze({ id: 'return-trends', title: 'Return trends', owner: 'Support', updated: 'Yesterday' }),
      Object.freeze({ id: 'fulfilment-delays', title: 'Fulfilment delays', owner: 'Operations', updated: '2 days ago' })
    ]);
    // Seed order is authoritative; archives contain identities, never filtered indices.
    const archived = new Set();
    const $ = id => document.getElementById(id);
    const search = $('search'), mode = $('mode'), results = $('results');
    const dialog = $('archive-dialog'), cancel = $('cancel'), confirm = $('confirm');
    let pending = null;

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }
    function button(text, action, className) {
      const node = element('button', text, className);
      node.type = 'button';
      node.addEventListener('click', action);
      return node;
    }
    function announce(text) { $('status').textContent = text; }
    function matchingReports() {
      const query = search.value.trim().toLowerCase();
      return reports.filter(report => !archived.has(report.id) && report.title.toLowerCase().includes(query));
    }
    function stateMessage() {
      if (mode.value === 'loading') return 'Loading demo reports…';
      if (mode.value === 'error') return 'Demo reports could not be loaded.';
      const count = matchingReports().length;
      const summary = `${count} ${count === 1 ? 'report' : 'reports'} found.`;
      return mode.value === 'blocked'
        ? `Demo permission denied. Archive actions are unavailable in this simulated state. ${summary}`
        : `Normal demo state. ${summary}`;
    }
    function render() {
      const blocked = mode.value === 'blocked';
      const hiddenActions = mode.value === 'loading' || mode.value === 'error';
      $('clear').hidden = search.value.length === 0;
      results.setAttribute('aria-busy', String(mode.value === 'loading'));
      results.replaceChildren();
      if (hiddenActions) {
        const message = element('div', undefined, 'message');
        message.append(element('p', stateMessage()));
        if (mode.value === 'error') message.append(button('Retry', () => {
          mode.value = 'normal';
          render();
          search.focus();
          announce(`Demo reports restored. ${stateMessage()}`);
        }, 'primary'));
        results.append(message);
      } else {
        if (blocked) results.append(element('p', 'Demo permission denied. Archive actions are unavailable in this simulated state.', 'blocked'));
        const visible = matchingReports();
        if (!visible.length) {
          results.append(element('p', search.value.trim()
            ? 'No matching reports'
            : 'No saved reports. Undo an archive to restore a report.', 'message'));
        } else {
          const list = element('ul', undefined, 'report-list');
          for (const report of visible) {
            const row = element('li', undefined, 'report');
            const content = element('div', undefined, 'report-content');
            const metadata = element('div', undefined, 'metadata');
            metadata.append(element('span', `Owner: ${report.owner}`), element('span', `Updated: ${report.updated}`));
            content.append(element('h2', report.title), metadata);
            const action = button(blocked ? 'Archive (unavailable)' : 'Archive', () => openArchive(report, action));
            action.id = `archive-${report.id}`;
            action.setAttribute('aria-label', `Archive ${report.title}`);
            action.disabled = blocked;
            row.append(content, action);
            list.append(row);
          }
          results.append(list);
        }
      }
      const feedback = $('feedback-list');
      feedback.replaceChildren();
      for (const id of archived) {
        const report = reports.find(item => item.id === id);
        const entry = element('li', undefined, 'feedback');
        const undo = button(blocked ? 'Undo (unavailable)' : 'Undo', () => restore(report));
        undo.setAttribute('aria-label', `Undo archive of ${report.title}`);
        undo.disabled = blocked;
        undo.hidden = hiddenActions;
        entry.append(element('p', `Archived ${report.title}.`), undo);
        feedback.append(entry);
      }
      $('feedback').hidden = archived.size === 0;
    }
    function openArchive(report, opener) {
      if (mode.value !== 'normal' || archived.has(report.id) || dialog.open) return;
      pending = { report, opener };
      $('dialog-title').textContent = `Archive ${report.title}?`;
      document.documentElement.classList.add('modal-open');
      dialog.showModal();
      dialog.scrollTop = 0;
      cancel.focus();
    }
    function closeArchive() {
      const captured = pending;
      pending = null;
      dialog.close();
      document.documentElement.classList.remove('modal-open');
      return captured;
    }
    function cancelArchive() {
      const captured = closeArchive();
      if (captured?.opener.isConnected) captured.opener.focus();
      else search.focus();
    }
    function restore(report) {
      if (mode.value !== 'normal' || !archived.delete(report.id)) return;
      render();
      const action = $(`archive-${report.id}`);
      if (action && !action.disabled) action.focus();
      else search.focus();
      announce(`Restored ${report.title}.`);
    }
    search.addEventListener('input', () => { render(); announce(stateMessage()); });
    $('clear').addEventListener('click', () => {
      search.value = '';
      render();
      search.focus();
      announce(stateMessage());
    });
    mode.addEventListener('change', () => { render(); announce(stateMessage()); });
    cancel.addEventListener('click', cancelArchive);
    dialog.addEventListener('cancel', event => { event.preventDefault(); cancelArchive(); });
    dialog.addEventListener('keydown', event => {
      if (event.key === 'Escape') { event.preventDefault(); cancelArchive(); }
      if (event.key !== 'Tab') return;
      if (event.shiftKey && document.activeElement === cancel) {
        event.preventDefault(); confirm.focus();
      } else if (!event.shiftKey && document.activeElement === confirm) {
        event.preventDefault(); cancel.focus();
      }
    });
    // Native modal behavior makes the background inert. No backdrop-click handler.
    confirm.addEventListener('click', () => {
      if (!pending || mode.value !== 'normal') return;
      const { report } = closeArchive();
      archived.add(report.id);
      render();
      search.focus();
      announce(`Archived ${report.title}. Undo available.`);
    });
    // Keep the scrolling modal within the visual viewport when a keyboard reduces it.
    function sizeDialog() {
      if (window.visualViewport) dialog.style.setProperty('--dialog-height', `${window.visualViewport.height}px`);
    }
    window.visualViewport?.addEventListener('resize', sizeDialog);
    sizeDialog();
    render();
  </script>
</body>
</html>
